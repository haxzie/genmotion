name: Publish to npm

# Publishes the public packages — `genmotion`, `create-genmotion`,
# `@genmotion/three-engine`, `@genmotion/shared` — with Changesets.
#
# A push to main with pending changesets opens (or updates) a "Version
# packages" PR. Merging that PR bumps versions and publishes, with npm
# provenance. Everything else in the workspace is private and never published.
#
# Secrets: NPM_TOKEN — an npm automation token with publish rights to the
# `genmotion` and `create-genmotion` names and the `@genmotion` scope.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Test the published packages
        run: pnpm --filter ./packages/shared --filter ./packages/three-engine --filter ./packages/render --filter ./packages/cli test

      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "Version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
