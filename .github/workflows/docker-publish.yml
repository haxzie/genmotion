name: Publish Docker images (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/renderer/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  # Not cancel-in-progress: this workflow *publishes* images. Cancelling a run
  # because a newer push arrived drops the image for the older commit entirely,
  # which is how the pricing change ended up never being built.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            build_args: ""
          - name: renderer
            dockerfile: apps/renderer/Dockerfile
            # Slim image: e2b offloads Chromium to a sandbox, so the browser +
            # its ~1GB of OS libs are NOT baked in. Use RENDER_PROVIDER=local
            # here for a self-contained single-box renderer.
            build_args: |
              RENDER_PROVIDER=e2b
    steps:
      - uses: actions/checkout@v4

      # Only build/deploy a service when its own folder — or the shared
      # workspace (packages, lockfile, this workflow) — changed. Manual dispatch
      # and tag pushes always build both.
      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/docker-publish.yml'
            renderer:
              - 'apps/renderer/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/docker-publish.yml'

      - name: Decide whether to build ${{ matrix.name }}
        id: gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          CHANGED: ${{ matrix.name == 'api' && steps.changes.outputs.api || steps.changes.outputs.renderer }}
        run: |
          if [ "$FORCE" = "true" ] || [ "$CHANGED" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes for ${{ matrix.name }} — skipping build & deploy."
          fi

      # ghcr requires a lowercase image path; lowercase the owner defensively.
      - name: Compute image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=${REGISTRY}/${OWNER,,}/genmotion-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.build == 'true'

      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        if: steps.gate.outputs.build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          # Don't push on PRs — build only, to validate the Dockerfile.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # After the API image is published, tell Coolify to pull & redeploy it.
      # Only for the API image, on real pushes (not PRs). No-ops (doesn't fail)
      # if the Coolify secrets aren't configured yet.
      - name: Trigger Coolify redeploy (API)
        if: matrix.name == 'api' && github.event_name != 'pull_request' && steps.gate.outputs.build == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_API_UUID" ]; then
            echo "Coolify secrets not set — skipping redeploy."
            exit 0
          fi
          # Coolify's deploy endpoint has answered GET with 405 since 2026-08-12:
          # the verb changed under us, and because this step is the last one,
          # every push since built an image that nothing ever pulled. Rather
          # than pin a guess, try POST and fall back to GET, reporting the code
          # either way so a future change is visible instead of silent.
          deploy() {
            local uuid="$1" url code
            url="${COOLIFY_URL%/}/api/v1/deploy?uuid=${uuid}&force=true"
            for verb in POST GET; do
              code=$(curl --silent --show-error --output /tmp/coolify.out \
                --write-out '%{http_code}' --request "$verb" "$url" \
                --header "Authorization: Bearer ${COOLIFY_API_TOKEN}") || code=000
              echo "  $verb -> $code"
              case "$code" in
                2*) echo "redeploy accepted via $verb"; return 0 ;;
              esac
            done
            echo "::error::Coolify refused both POST and GET. Last body:"
            cat /tmp/coolify.out || true
            return 1
          }

          echo "Triggering Coolify redeploy for uuid=$COOLIFY_API_UUID …"
          deploy "$COOLIFY_API_UUID"

      # Same, for the renderer image (its own Coolify resource UUID).
      - name: Trigger Coolify redeploy (renderer)
        if: matrix.name == 'renderer' && github.event_name != 'pull_request' && steps.gate.outputs.build == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_RENDERER_UUID: ${{ secrets.COOLIFY_RENDERER_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_RENDERER_UUID" ]; then
            echo "Coolify secrets not set — skipping redeploy."
            exit 0
          fi
          # Coolify's deploy endpoint has answered GET with 405 since 2026-08-12:
          # the verb changed under us, and because this step is the last one,
          # every push since built an image that nothing ever pulled. Rather
          # than pin a guess, try POST and fall back to GET, reporting the code
          # either way so a future change is visible instead of silent.
          deploy() {
            local uuid="$1" url code
            url="${COOLIFY_URL%/}/api/v1/deploy?uuid=${uuid}&force=true"
            for verb in POST GET; do
              code=$(curl --silent --show-error --output /tmp/coolify.out \
                --write-out '%{http_code}' --request "$verb" "$url" \
                --header "Authorization: Bearer ${COOLIFY_API_TOKEN}") || code=000
              echo "  $verb -> $code"
              case "$code" in
                2*) echo "redeploy accepted via $verb"; return 0 ;;
              esac
            done
            echo "::error::Coolify refused both POST and GET. Last body:"
            cat /tmp/coolify.out || true
            return 1
          }

          echo "Triggering Coolify redeploy for uuid=$COOLIFY_RENDERER_UUID …"
          deploy "$COOLIFY_RENDERER_UUID"
