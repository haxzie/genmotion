name: Publish Docker images (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/renderer/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            build_args: ""
          - name: renderer
            dockerfile: apps/renderer/Dockerfile
            # Slim image: e2b offloads Chromium to a sandbox, so the browser +
            # its ~1GB of OS libs are NOT baked in. Use RENDER_PROVIDER=local
            # here for a self-contained single-box renderer.
            build_args: |
              RENDER_PROVIDER=e2b
    steps:
      - uses: actions/checkout@v4

      # ghcr requires a lowercase image path; lowercase the owner defensively.
      - name: Compute image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=${REGISTRY}/${OWNER,,}/genmotion-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          # Don't push on PRs — build only, to validate the Dockerfile.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # After the API image is published, tell Coolify to pull & redeploy it.
      # Only for the API image, on real pushes (not PRs). No-ops (doesn't fail)
      # if the Coolify secrets aren't configured yet.
      - name: Trigger Coolify redeploy (API)
        if: matrix.name == 'api' && github.event_name != 'pull_request'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_API_UUID" ]; then
            echo "Coolify secrets not set — skipping redeploy."
            exit 0
          fi
          echo "Triggering Coolify redeploy for uuid=$COOLIFY_API_UUID …"
          curl --fail --silent --show-error --request GET \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_API_UUID}&force=true" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}"

      # Same, for the renderer image (its own Coolify resource UUID).
      - name: Trigger Coolify redeploy (renderer)
        if: matrix.name == 'renderer' && github.event_name != 'pull_request'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_RENDERER_UUID: ${{ secrets.COOLIFY_RENDERER_UUID }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_RENDERER_UUID" ]; then
            echo "Coolify secrets not set — skipping redeploy."
            exit 0
          fi
          echo "Triggering Coolify redeploy for uuid=$COOLIFY_RENDERER_UUID …"
          curl --fail --silent --show-error --request GET \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_RENDERER_UUID}&force=true" \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}"
