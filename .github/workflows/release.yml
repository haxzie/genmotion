name: Release

# Versioning and releases for everything that ships, driven by Changesets.
#
# 1. A change that should ship carries a changeset (`pnpm changeset`).
# 2. A push to main with pending changesets opens (or updates) a "Version
#    packages" PR that bumps versions and writes the CHANGELOGs.
# 3. Merging that PR lands on main with no pending changesets, and this run
#    releases whatever moved:
#    - the npm packages (`@genmotion/cli`, `create-genmotion`,
#      `@genmotion/three-engine`, `@genmotion/shared`), published with
#      provenance;
#    - the desktop app, which stays private (never on npm) but is versioned
#      here like the rest: when apps/desktop's version has no `desktop-v<version>`
#      tag yet, this tags it and runs desktop-release.yml — the same signed,
#      notarized build and GitHub release as a hand-pushed tag.
#
# Every other workspace package is private and ignored by Changesets.
#
# Secrets: NPM_TOKEN — an npm automation token with publish rights to the
# `create-genmotion` name and the `@genmotion` scope (the CLI is `@genmotion/cli`:
# npm refuses the bare `genmotion` name as too close to `emotion`); and the
# desktop signing secrets desktop-release.yml lists.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  changesets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      desktop_tag: ${{ steps.desktop.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # Before npm, so a publish problem (a missing NPM_TOKEN, a name clash)
      # never holds up a desktop release, and only once there is nothing left
      # to version: a pending changeset means the Version packages PR has not
      # merged yet, and the version on main is still the old one.
      - name: Tag a new desktop version
        id: desktop
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "$pending changeset(s) pending — the Version packages PR decides the next desktop version"
            exit 0
          fi
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="desktop-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tagged $tag"

      - name: Test the published packages
        run: pnpm --filter ./packages/shared --filter ./packages/three-engine --filter ./packages/render --filter ./packages/cli test

      - name: Version PR or publish
        id: publish
        uses: changesets/action@v1
        with:
          # `init` pins the CLI's own minor line, so a version bump changes
          # what it writes; regenerating the starter here keeps the Version
          # packages PR from failing its own drift check.
          version: pnpm version-packages
          publish: pnpm release
          title: "Version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # `changeset publish` runs npm with --json and, when npm's error isn't
      # the shape it expects, crashes in its own error handling instead of
      # printing it ("Cannot read properties of undefined (reading
      # 'includes')"). Publish whatever is still missing one package at a time
      # with npm's own output, so a failure says what npm actually objected to.
      - name: Publish what's missing, with npm's own errors
        if: failure() && steps.publish.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          if [ "$pending" -gt 0 ]; then
            echo "$pending changeset(s) pending: nothing is due to publish yet"
            exit 1
          fi
          status=0
          for dir in packages/shared packages/three-engine packages/cli packages/create-genmotion; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            echo "::group::publish $name@$version"
            (cd "$dir" && pnpm publish --access public --no-git-checks) || status=1
            echo "::endgroup::"
          done
          exit $status

  # Called, not triggered by the tag: a tag pushed with GITHUB_TOKEN starts
  # no workflow runs. `always()` because the npm side may fail after the tag
  # was pushed, and the desktop release must not be stranded behind it.
  desktop:
    needs: changesets
    if: always() && needs.changesets.outputs.desktop_tag != ''
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.changesets.outputs.desktop_tag }}
    secrets: inherit
