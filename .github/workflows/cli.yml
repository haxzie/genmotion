name: CLI

# The genmotion CLI, its renderer and the starter repo, on every PR that
# touches them: typecheck, unit tests, a real headless render (Chromium is
# downloaded by the renderer itself, exactly as on a user's first run), and a
# check that examples/three-starter still matches `genmotion init`.

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/render/**"
      - "packages/project/**"
      - "packages/three-engine/**"
      - "packages/shared/**"
      - "packages/compiler/**"
      - "packages/ai/**"
      - "packages/create-genmotion/**"
      - "examples/**"
      - "scripts/sync-starter.mjs"
      - ".github/workflows/cli.yml"
  push:
    branches: [main]
    paths:
      - "packages/cli/**"
      - "packages/render/**"
      - "packages/project/**"
      - "packages/three-engine/**"
      - "packages/shared/**"
      - "packages/compiler/**"
      - "packages/ai/**"
      - "packages/create-genmotion/**"
      - "examples/**"

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm --filter ./packages/render --filter ./packages/cli --filter ./packages/project --filter ./packages/three-engine typecheck
      - run: node packages/render/node_modules/playwright-core/cli.js install chromium-headless-shell
      - run: pnpm --filter ./packages/render --filter ./packages/cli --filter ./packages/project --filter ./packages/three-engine test
      - run: node scripts/sync-starter.mjs --check
      - name: Build and pack the CLI
        run: |
          pnpm --filter ./packages/shared --filter ./packages/three-engine --filter ./packages/cli build
          cd packages/cli && pnpm pack --pack-destination "$RUNNER_TEMP"
