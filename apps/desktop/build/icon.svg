<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    macOS icon geometry: 1024 canvas with the artwork inset to 824×824 and a
    185.4 corner radius, which is what gives a native app its familiar shape
    and optical size next to the system icons.
  -->
  <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4" fill="#0B1533"/>

